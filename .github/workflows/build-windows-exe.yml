name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Upload assets to a GitHub Release"
        required: false
        type: boolean
        default: false

      release_tag:
        description: "Release tag. Empty uses package.json version, for example v1.2.7"
        required: false
        type: string
        default: ""

      bundle_runtime_binaries:
        description: "Bundle ffmpeg, ffprobe, mkvmerge, yt-dlp and deno into the app"
        required: false
        type: boolean
        default: false

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Download runtime binaries
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bundle_runtime_binaries == 'true'
        run: npm run download:binaries

      - name: Build NSIS installer
        run: npm run desktop:build:nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package release assets
        id: package_assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = node -p "require('./package.json').version"
          $assetsDir = "dist/release-assets"
          $githubRef = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $releaseTag = "${{ github.ref_name }}"
          $repository = "${{ github.repository }}"

          $isTagBuild = (
            $eventName -eq "push" -and
            $githubRef.StartsWith("refs/tags/")
          )

          if (-not $isTagBuild) {
            $releaseTag = "${{ github.event.inputs.release_tag }}"

            if ([string]::IsNullOrWhiteSpace($releaseTag)) {
              $releaseTag = "v$version"
            }
          }

          Write-Host "Package version: $version"
          Write-Host "Release tag: $releaseTag"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $assetsDir | Out-Null

          # Mevcut GitHub Release içindeki asset adlarını al.
          $existingAssetNames = @()

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $encodedReleaseTag = [Uri]::EscapeDataString($releaseTag)
          $releaseApiUrl = "https://api.github.com/repos/$repository/releases/tags/$encodedReleaseTag"

          try {
            $release = Invoke-RestMethod `
              -Uri $releaseApiUrl `
              -Headers $headers `
              -Method Get

            $existingAssetNames = @(
              $release.assets |
                ForEach-Object {
                  $_.name
                }
            )

            Write-Host "Existing release assets:"

            if ($existingAssetNames.Count -gt 0) {
              $existingAssetNames |
                ForEach-Object {
                  Write-Host " - $_"
                }
            } else {
              Write-Host " - No assets found."
            }
          } catch {
            $statusCode = 0

            if ($_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }

            if ($statusCode -eq 404) {
              Write-Host "Release $releaseTag does not exist yet."
              $existingAssetNames = @()
            } else {
              throw
            }
          }

          # Checkout edilen repository içindeki yerel release asset'lerini de kontrol et.
          if (Test-Path $assetsDir) {
            $localAssetNames = @(
              Get-ChildItem `
                -Path $assetsDir `
                -File `
                -ErrorAction SilentlyContinue |
                  ForEach-Object {
                    $_.Name
                  }
            )

            $existingAssetNames = @(
              $existingAssetNames
              $localAssetNames
            ) | Sort-Object -Unique
          }

          # Dosya çiftinin kullanabileceği boş eki bul.
          #
          # İlk build:
          #   dosya.exe
          #   dosya.zip
          #
          # İkinci build:
          #   dosya.hotfix.exe
          #   dosya.hotfix.zip
          #
          # Sonraki build'ler:
          #   dosya.hotfix2.exe
          #   dosya.hotfix2.zip

          $revision = 0

          while ($true) {
            if ($revision -eq 0) {
              $suffix = ""
            } elseif ($revision -eq 1) {
              $suffix = ".hotfix"
            } else {
              $suffix = ".hotfix$revision"
            }

            $setupName = "Gharmonize-x64.Setup.Version.v$version$suffix.exe"
            $portableName = "Gharmonize-x64.Portable.Folder.Version.v$version$suffix"
            $portableZipName = "$portableName.zip"

            $setupExists = (
              $existingAssetNames -contains $setupName
            ) -or (
              Test-Path (Join-Path $assetsDir $setupName)
            )

            $portableExists = (
              $existingAssetNames -contains $portableZipName
            ) -or (
              Test-Path (Join-Path $assetsDir $portableZipName)
            )

            if (-not $setupExists -and -not $portableExists) {
              break
            }

            $revision++
          }

          $setupDestination = Join-Path $assetsDir $setupName
          $portableFolder = Join-Path $assetsDir $portableName
          $portableZip = Join-Path $assetsDir $portableZipName

          Write-Host "Selected setup name: $setupName"
          Write-Host "Selected portable name: $portableZipName"

          # electron-builder tarafından oluşturulan NSIS EXE dosyasını bul.
          $setup = Get-ChildItem `
            -Path dist `
            -Filter "*.exe" `
            -File |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

          if (-not $setup) {
            throw "No installer exe found directly under dist."
          }

          Write-Host "Installer source: $($setup.FullName)"

          # Yeni ve benzersiz adıyla installer'ı kopyala.
          Copy-Item `
            -Path $setup.FullName `
            -Destination $setupDestination `
            -Force

          if (-not (Test-Path "dist/win-unpacked")) {
            throw "dist/win-unpacked was not created by electron-builder."
          }

          if (Test-Path $portableFolder) {
            Remove-Item `
              -Path $portableFolder `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $portableFolder | Out-Null

          Copy-Item `
            -Path "dist/win-unpacked/*" `
            -Destination $portableFolder `
            -Recurse `
            -Force

          Compress-Archive `
            -Path $portableFolder `
            -DestinationPath $portableZip `
            -CompressionLevel Optimal

          if (-not (Test-Path $setupDestination)) {
            throw "Setup package was not created: $setupDestination"
          }

          if (-not (Test-Path $portableZip)) {
            throw "Portable ZIP was not created: $portableZip"
          }

          Write-Host "Created release assets:"
          Write-Host " - $setupDestination"
          Write-Host " - $portableZip"

          "VERSION=$version" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          "SETUP_NAME=$setupName" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          "PORTABLE_ZIP=$portableZipName" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          "version=$version" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append

          "release_tag=$releaseTag" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append

          "setup_name=$setupName" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append

          "portable_zip=$portableZipName" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gharmonize-windows-v${{ steps.package_assets.outputs.version }}
          path: |
            dist/release-assets/${{ steps.package_assets.outputs.setup_name }}
            dist/release-assets/${{ steps.package_assets.outputs.portable_zip }}
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_assets.outputs.release_tag }}
          name: Gharmonize ${{ steps.package_assets.outputs.release_tag }}
          files: |
            dist/release-assets/${{ steps.package_assets.outputs.setup_name }}
            dist/release-assets/${{ steps.package_assets.outputs.portable_zip }}
