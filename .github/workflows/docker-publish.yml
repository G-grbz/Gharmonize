name: Publish Docker image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to publish (for example v1.3.8)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: g-grbz/gharmonize
    steps:
      - name: Resolve release ref
        id: release_ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref_name }}
          MANUAL_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            REF="$MANUAL_REF"
          else
            REF="$PUSH_REF"
          fi

          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v1.3.8, got: $REF" >&2
            exit 1
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_ref.outputs.ref }}
          fetch-depth: 1

      - name: Normalize Docker ignore file for historical tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .dockerigrone && ! -f .dockerignore ]]; then
            mv .dockerigrone .dockerignore
          fi

      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_REF: ${{ steps.release_ref.outputs.ref }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${RELEASE_REF#v}"

          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version ($VERSION) does not match tag ($RELEASE_REF)." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=Gharmonize
            org.opencontainers.image.description=Media download, conversion, ripping, tagging, and music automation toolkit
            org.opencontainers.image.source=https://github.com/G-grbz/Gharmonize
            org.opencontainers.image.url=https://github.com/G-grbz/Gharmonize
            org.opencontainers.image.documentation=https://github.com/G-grbz/Gharmonize/blob/main/docs/DOCKER.md
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest GHCR image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
