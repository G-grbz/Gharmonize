name: Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run check:version
  windows:
    needs: verify
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Package Windows release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $setup = Get-ChildItem dist -File -Filter '*.exe' | Where-Object { $_.Name -match 'Setup' } | Select-Object -First 1
          $portable = Get-ChildItem dist -File -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Setup' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer not found' }
          if (-not $portable) { throw 'Portable EXE not found' }
          Copy-Item $setup.FullName "release/Gharmonize-x64.Setup.v$env:VERSION.exe"
          Copy-Item $portable.FullName "release/Gharmonize-x64.Portable.v$env:VERSION.exe"
          if (Test-Path 'dist/win-unpacked') {
            Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath "release/Gharmonize-x64.Portable.Folder.v$env:VERSION.zip" -CompressionLevel Optimal
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error
  linux:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Linux packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools zstd zsync
      - run: npm run desktop:build:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify native Linux packages
        run: node scripts/verify-linux-packages.mjs dist
      - name: Collect native Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/Gharmonize-*.deb dist/Gharmonize-*.rpm dist/Gharmonize-*.pkg.tar.zst release/
      - name: Package updateable AppImage and zsync metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APPIMAGE="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          scripts/package-appimage-release.sh \
            "$APPIMAGE" \
            "release/Gharmonize-x86_64.v${VERSION}.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error
  android:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Also validates the checked-in Gradle wrapper.
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Every release must be signed with the same key, or phones refuse
          # to install it over the previous version.
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets are required to sign the Android app."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/gharmonize-player-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          {
            echo "GHP_KEYSTORE_FILE=$KEYSTORE"
            echo "GHP_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "GHP_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "GHP_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build Gharmonize Player APK
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          # 1.4.6 -> 1004006: grows with every release, above the 0.x test builds.
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          ./gradlew --no-daemon assembleRelease -PghVersionName="$VERSION" -PghVersionCode="$VERSION_CODE"
      - name: Verify APK signature and version
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256)"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -q "versionName='$VERSION'"
          mkdir -p release
          cp "$APK" "release/Gharmonize-Player-Android.v${VERSION}.apk"
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/gharmonize-player-release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release/*
          if-no-files-found: error
  publish:
    needs: [verify, windows, linux, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create source archive and SBOM
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix="Gharmonize-v${VERSION}/" -o "release/Gharmonize-v${VERSION}-source.zip" "$GITHUB_SHA"
          npm sbom --sbom-format cyclonedx > "release/Gharmonize-v${VERSION}.sbom.cdx.json"
      - name: Create and sign release manifest
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "${GPG_PRIVATE_KEY:-}" || -z "${GPG_PASSPHRASE:-}" ]]; then
            echo "::error::GPG_PRIVATE_KEY and GPG_PASSPHRASE repository secrets are required for release signing."
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/gharmonize-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill all >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT

          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$FINGERPRINT"

          gpg --batch --armor --export "$FINGERPRINT" > release/Gharmonize-release-signing-key.asc

          (
            cd release
            sha256sum Gharmonize-* > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user "$FINGERPRINT" \
            --armor --detach-sign \
            --output release/SHA256SUMS.asc \
            release/SHA256SUMS

          gpg --batch --verify release/SHA256SUMS.asc release/SHA256SUMS
          echo "Release signing key fingerprint: $FINGERPRINT"
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            release/Gharmonize-*
            release/SHA256SUMS
            release/SHA256SUMS.asc
      - name: Attach SBOM attestation to source archive
        uses: actions/attest@v4
        with:
          subject-path: release/Gharmonize-v${{ env.VERSION }}-source.zip
          sbom-path: release/Gharmonize-v${{ env.VERSION }}.sbom.cdx.json
      - name: Publish immutable GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite published assets." >&2
            exit 1
          fi
          SIGNING_NOTICE="$(cat <<EOF
          ## Code signing policy

          Windows downloads do not carry a trusted Authenticode signature. The GPG-signed checksum manifest and GitHub artifact attestations verify release integrity, not Windows Authenticode trust.

          See the [Gharmonize Code Signing Policy](https://github.com/G-grbz/Gharmonize/blob/${GITHUB_REF_NAME}/CODE_SIGNING_POLICY.md) and [Privacy Policy](https://github.com/G-grbz/Gharmonize/blob/${GITHUB_REF_NAME}/PRIVACY.md).
          EOF
          )"
          RELEASE_NOTES="$SIGNING_NOTICE"
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --generate-notes \
            --notes "$RELEASE_NOTES" \
            --title "Gharmonize $GITHUB_REF_NAME"
