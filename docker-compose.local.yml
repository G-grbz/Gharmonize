services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Gharmonize
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${RUN_MEDIA_GID:-65534}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5174}
      - GHARMONIZE_HOST=0.0.0.0
      - GHARMONIZE_MASTER_KEY_FILE=/usr/src/app/cache/.gharmonize-key
      - GHARMONIZE_INITIAL_ADMIN_PASSWORD_FILE=/usr/src/app/cache/INITIAL_ADMIN_PASSWORD.txt
      - YT_FORCE_IPV4=1
      - GHARMONIZE_WEB_BINARIES_IN_DOCKER=1
      - GHARMONIZE_WEB_CACHE_DIR=/usr/src/app/cache/binaries
      - GHARMONIZE_BINARY_TMP_DIR=/usr/src/app/temp/binary-tmp
      - TMPDIR=/usr/src/app/temp/binary-tmp
      - TMP=/usr/src/app/temp/binary-tmp
      - TEMP=/usr/src/app/temp/binary-tmp
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DATA_DIR=/usr/src/app
      - OUTPUTS_DISPLAY_DIR=/opt/gharmonize/outputs
      - RETAG_ROOTS=/music
    ports:
      - "${PORT:-5174}:${PORT:-5174}"
    volumes:
      - /opt/gharmonize/uploads:/usr/src/app/uploads
      - /opt/gharmonize/outputs:/usr/src/app/outputs
      - /opt/gharmonize/temp:/usr/src/app/temp
      - /opt/gharmonize/cache:/usr/src/app/cache
      - /opt/gharmonize/local-inputs:/usr/src/app/local-inputs
      - ${MUSIC_DIR:-/opt/gharmonize/local-inputs}:/music
      - /opt/gharmonize/cookies:/usr/src/app/cookies
      - /opt/gharmonize/.env:/usr/src/app/.env
      - /home:/home:ro
      - /run/media:/run/media:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 5174) + '/').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
